<div class="wrap"><style>:root{--teamw:7.1em}</style><header class="top"><div><div class="eyebrow">ALTP</div><h1>ALTP Season 1</h1></div><nav class="pager" aria-label="Seasons"><a href="../index.html">All seasons</a></nav></header><ul class="facts"><li><b>Played</b> dates not recorded</li><li><b>Tiers</b> ALTP</li></ul><nav class="jump" role="tablist" aria-label="Sections"><button type="button" role="tab" aria-selected="true" data-panel="altp">ALTP</button></nav><div class="legend"><span>Everything shown is confirmed by two separate sources.</span><span><span class="num">212 min</span> minutes played for the team</span></div><section class="tier" id="altp"><div class="tierhead"><span class="swatch "></span><h2>ALTP</h2></div><div class="block"><h3>Rosters</h3></div></section></div>
<script>
const NALTP = (() => {
  let store = null;
  try { sessionStorage.setItem("naltp:t", "1"); sessionStorage.removeItem("naltp:t"); store = sessionStorage; } catch (e) {}
  const FRESH = 4 * 60 * 60 * 1000;

  const read = key => {
    if (!store) return null;
    try {
      const s = JSON.parse(store.getItem(key) || "null");
      return s && Date.now() - (s.at || 0) < FRESH ? s : null;
    } catch (e) { return null; }
  };
  const write = (key, value) => {
    if (!store) return;
    try { store.setItem(key, JSON.stringify({...value, at: Date.now()})); }
    catch (e) {                                              // full: this session's own pages go first
      try { for (const k of Object.keys(store)) if (k.startsWith("naltp:")) store.removeItem(k); } catch (_) {}
    }
  };

  // what a page fetched, kept for as long as the tab lives, so coming back draws at once
  const held = {
    get: name => read("naltp:held:" + name),
    set: (name, value) => write("naltp:held:" + name, {value}),
    async json(name, url) {
      const had = held.get(name);
      if (had && had.value) return had.value;
      const got = await fetch(url).then(r => (r.ok ? r.json() : Promise.reject(new Error(r.status))));
      held.set(name, got);
      return got;
    },
  };

  const keep = opts => {
    opts = opts || {};
    const key = "naltp:where:" + location.pathname + location.search;
    const was = read(key);
    // a link that names a place on the page beats what a reader left behind - unless it is the same
    // place they left from, which is exactly what coming back looks like
    const fresh = !!location.hash && (!was || was.hash !== location.hash);
    const put = s => {
      if (!s || fresh) return;
      const most = Math.max(0, document.documentElement.scrollHeight - innerHeight);
      window.scrollTo(0, Math.min(s.y || 0, most));
      for (const el of document.querySelectorAll("[data-keep]")) {
        const at = s.parts && s.parts[el.dataset.keep];
        if (at != null) el.scrollTop = at;
      }
    };
    const save = () => {
      const s = {y: window.scrollY || document.documentElement.scrollTop || 0, hash: location.hash, parts: {}};
      for (const el of document.querySelectorAll("[data-keep]")) s.parts[el.dataset.keep] = el.scrollTop;
      try { Object.assign(s, opts.get ? opts.get() : {}); } catch (e) {}
      write(key, s);
    };
    if (!store) return {save: () => {}, was: null, back: () => {}, fresh};
    let t = 0;
    addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(save, 120); }, {passive: true});
    addEventListener("click", e => { if (e.target.closest("a")) save(); }, true);
    addEventListener("pagehide", save);
    addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
    if (was) {
      try { opts.set && opts.set(was, fresh); } catch (e) {}
      if (!fresh) {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        put(was);                                            // now, once it has drawn, once it has settled
        requestAnimationFrame(() => put(was));
        addEventListener("load", () => setTimeout(() => put(was), 0));
      }
    }
    return {save, was, back: () => put(was), fresh};
  };

  return {keep, held};
})();
const keepState = NALTP.keep;

// each row of tabs owns the panels its buttons name, so the leagues and the tables inside one
// work the same way; a link to a panel still opens it, and without this the page reads straight down
for (const bar of document.querySelectorAll('[role=tablist]')) {
  const ids = [...bar.querySelectorAll('[data-panel]')].map(b => b.dataset.panel);
  const show = id => {
    for (const b of bar.querySelectorAll('[data-panel]')) b.setAttribute('aria-selected', b.dataset.panel === id);
    for (const other of ids) { const el = document.getElementById(other); if (el) el.hidden = other !== id; }
  };
  bar.__show = show;
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-panel]');
    if (b) { show(b.dataset.panel); history.replaceState(null, '', '#' + b.dataset.panel); }
  });
  const want = decodeURIComponent(location.hash.slice(1));
  if (want && ids.includes(want)) show(want);
  else if (want && document.getElementById(want)) {
    const holder = document.getElementById(want).closest('[id]');
    for (const id of ids) if (document.getElementById(id) && document.getElementById(id).contains(document.getElementById(want))) show(id);
  }
}

// the bracket: a series is a button, and the panel underneath is whichever one is open. Without
// this script every series' detail simply reads down the page, which is the honest fallback.
for (const panel of document.querySelectorAll('.serpanel')) {
  const block = panel.closest('.block');
  const boxes = [...block.querySelectorAll('.ser')];
  const show = id => {
    for (const d of panel.querySelectorAll('.serdetail')) d.hidden = d.id !== 'd-' + id;
    for (const b of boxes) b.setAttribute('aria-pressed', String(b.dataset.s === id));
    panel.dataset.open = id;
  };
  for (const b of boxes) b.addEventListener('click', () => show(b.dataset.s));
  const last = [...block.querySelectorAll('.ser')].pop();   // the final, where a bracket ends
  show((last && last.dataset.s) || panel.dataset.open);
}

// where you were: open a game, a sheet or a hub from here and coming back finds the same tabs open
// at the same place on the page, instead of the season starting over at the top
keepState({
  get: () => ({tabs: [...document.querySelectorAll('[role=tablist]')]
    .map(bar => (bar.querySelector('[aria-selected=true]') || {dataset: {}}).dataset.panel || '')}),
  set: s => {
    if (location.hash || !s.tabs) return;                   // a link that names a tab says which one
    document.querySelectorAll('[role=tablist]').forEach((bar, i) => { if (s.tabs[i]) bar.__show(s.tabs[i]); });
  }
});
</script>
