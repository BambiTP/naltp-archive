<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NALTP match</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--ground:#eef1f4;--surface:#fff;--ink:#1a1f27;--muted:#5e6776;--line:#d9dee6;--sunk:#f4f6f9;
  --red:#c7383b;--blue:#2b61c6;--display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0f1318;--surface:#171c23;--ink:#e6e9ee;
  --muted:#98a1ae;--line:#2a313b;--sunk:#1d232b;--red:#e0574f;--blue:#7aa7ff}}
:root[data-theme="dark"]{--ground:#0f1318;--surface:#171c23;--ink:#e6e9ee;--muted:#98a1ae;--line:#2a313b;--sunk:#1d232b;
  --red:#e0574f;--blue:#7aa7ff}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1000px;margin:0 auto}
a{color:inherit}
.back{font-size:13.5px;color:var(--muted);text-decoration:none;background:none;border:0;padding:0;font-family:inherit;cursor:pointer}
.back:hover{color:var(--ink)}
.backs{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
h1{font:700 clamp(24px,4vw,34px)/1.05 var(--display);text-transform:uppercase;margin:10px 0 4px}
.meta{color:var(--muted);font-size:14px;margin:0 0 18px}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:14px 18px;margin-bottom:16px}
.score .side{display:flex;align-items:baseline;gap:10px;font:700 22px/1 var(--display);text-transform:uppercase}
.score .n{font:500 30px/1 var(--mono)}
.score .dash{color:var(--muted)}
.side.one .n{color:var(--red)} .side.two .n{color:var(--blue)}
.ended{margin-left:auto;font-size:13px;color:var(--muted);text-transform:none;font-family:var(--body)}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
caption{text-align:left;font:700 16px var(--display);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;color:var(--muted)}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:600;color:var(--muted);background:var(--sunk);font-size:12.5px}
tbody tr:last-child td{border-bottom:0}
td.name{font-weight:600}
.tables{display:grid;gap:16px;grid-template-columns:1fr}
.played{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 16px;padding:12px 16px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;font-size:13.5px}
.played dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);
  font-weight:600;margin:0}
.played dd{margin:0 0 0 0;font-family:var(--mono);font-size:13px}
.played dt+dd{margin-inline-start:-14px}
.caps{margin-top:20px}
.caps h2{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.caps ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.caps li{display:flex;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);
  border-left-width:3px;border-radius:6px;padding:4px 10px;font-size:13.5px}
.caps li.one{border-left-color:var(--red)} .caps li.two{border-left-color:var(--blue)}
.caps .clock{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:44px}
.caps .who{font-weight:600}
.caps .for{margin-left:auto;color:var(--muted);font-size:12px;text-transform:uppercase;font-family:var(--display)}
@media (min-width:860px){.tables{grid-template-columns:1fr 1fr}}
.tw{min-width:0;overflow-x:auto;border-radius:12px}
.tw table{border-radius:12px}
.note{color:var(--muted);font-size:13.5px;margin-top:16px}
.warn{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13.5px}
.ways{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.ways a{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 13px;font-size:13.5px;text-decoration:none;color:var(--ink)}
.ways a:hover{border-color:var(--muted)}
.ways a b{font-weight:600}
.ways a span{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <p class="backs"><button type="button" class="back" id="back" hidden>← Back</button><a class="back" href="./">NALTP Archive</a></p>
  <div id="out"><h1>Loading…</h1></div>
</div>
<script>
function keepState(opts) {
  opts = opts || {};
  const key = "naltp:where:" + location.pathname + location.search;
  let store = null;
  try { sessionStorage.setItem("naltp:t", "1"); sessionStorage.removeItem("naltp:t"); store = sessionStorage; } catch (e) {}
  const read = () => { try { return JSON.parse(store.getItem(key) || "null"); } catch (e) { return null; } };
  const save = () => {
    if (!store) return;
    const s = {y: window.scrollY || document.documentElement.scrollTop || 0, parts: {}};
    document.querySelectorAll("[data-keep]").forEach(el => { s.parts[el.dataset.keep] = el.scrollTop; });
    try { Object.assign(s, opts.get ? opts.get() : {}); } catch (e) {}
    try { store.setItem(key, JSON.stringify(s)); } catch (e) {}
  };
  const put = s => {
    window.scrollTo(0, s.y || 0);
    document.querySelectorAll("[data-keep]").forEach(el => {
      const at = s.parts && s.parts[el.dataset.keep];
      if (at != null) el.scrollTop = at;
    });
  };
  if (store) {
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    let t = 0;
    addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(save, 150); }, {passive: true});
    addEventListener("click", e => { if (e.target.closest("a")) save(); }, true);
    addEventListener("pagehide", save);
    addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
    const s = read();
    if (s) {
      try { opts.set && opts.set(s); } catch (e) {}
      // once now, once the page has drawn itself, once more when the fonts and images have settled
      put(s); requestAnimationFrame(() => put(s));
      addEventListener("load", () => setTimeout(() => put(s), 0));
    }
  }
  return save;
}
(() => {
  keepState({});
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const id = new URLSearchParams(location.search).get("id") || "";
  const out = document.getElementById("out");
  const back = document.getElementById("back");
  if (history.length > 1) { back.hidden = false; back.addEventListener("click", () => history.back()); }
  if (!/^[A-Za-z0-9]+$/.test(id)) {
    out.innerHTML = `<h1>No match chosen</h1><p class="meta">Open a match from the games table or the coverage page.</p>`;
    return;
  }
  // the box score, in the order the league reads it. A record from tagpro.eu carries the minutes
  // each player was on the field; a stats sheet saved to pastebin carries the in-game score instead
  const COLS = [["minutes", "Min"], ["score", "Score"], ["points", "Pts"], ["tags", "Tags"], ["pops", "Pops"],
                ["grabs", "Grabs"], ["drops", "Drops"], ["hold", "Hold"], ["captures", "Caps"],
                ["caps_for", "Caps for"], ["caps_against", "Caps against"], ["cap_diff", "+/\u2212"],
                ["prevent", "Prevent"], ["returns", "Returns"], ["button", "Button"], ["block", "Block"],
                ["pups", "Pups"], ["pups_total", "Pups total"], ["pup_time", "Pup time"]];
  const onTunnel = /trycloudflare\.com$|^127\.0\.0\.1$|^localhost$/.test(location.hostname);
  const base = async () => {
    if (onTunnel) return "";
    const t = await fetch("tunnel.json", {cache: "no-store"}).then(r => r.json());
    return t.url.replace(/\/?$/, "/");
  };
  // a page the archive serves: straight there down the tunnel, or through the frame on GitHub Pages
  const ours = (b, path) => onTunnel ? b + path : "app.html?p=" + encodeURIComponent(path);
  const LEAGUE = {MLTP: "Majors", mLTP: "Minors", NLTP: "Novice"};

  base().then(b => fetch(`${b}viewer/data/eu/${id}.json`).then(r => r.ok ? r.json() : Promise.reject()).then(m => {
    const when = m.when ? m.when : m.date
      ? new Date(m.date * 1000).toLocaleString(undefined, {dateStyle: "medium", timeStyle: "short"}) : "";
    const cols = COLS.filter(([k]) => m.teams.some(t => t.players.some(p => p[k] !== undefined && p[k] !== null)));
    const table = t => `<div class="tw"><table><caption>${esc(t.team || t.name)}${t.team && t.name && t.team !== t.name ? ` <span style="color:var(--muted)">(${esc(t.name)})</span>` : ""}</caption>
      <thead><tr><th>Player</th>${cols.map(([, label]) => `<th>${esc(label)}</th>`).join("")}</tr></thead>
      <tbody>${t.players.map(p => `<tr><td class="name">${esc(p.name)}</td>${cols.map(([k]) => `<td>${esc(p[k] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    const stage = m.stage ? esc(m.stage) : (m.week ? "week " + esc(m.week) : "");
    document.title = `${m.team_1} v ${m.team_2} \u00b7 ${m.season}${m.stage ? " " + m.stage : m.week ? " week " + m.week : ""}`;
    const ended = m.ending ? (m.ending.kind === "overtime"
      ? `level ${esc(m.ending.at_whistle)} at the whistle, and played on`
      : `a flag still in hand at the whistle, ${esc(m.ending.at_whistle)}`) : "";
    // every way out of this page: the record itself on tagpro.eu, the cell of the hub that wrote
    // the score down, that hub, and the season it belongs to - each of them the archive's own copy
    // where the archive has one
    const ways = [
      m.held === "tagpro.eu" && m.url ? [m.url, "tagpro.eu", "the match itself \u2197", true] : null,
      m.cell ? [m.cell, "The cell", "in the season hub the score was written in", false] : null,
      m.hub && !m.cell ? [m.hub, "The season hub", "the sheet the league kept", false] : null,
      m.sheet ? [m.sheet, "Google Sheets", "the hub itself \u2197", true] : null,
      m.season_page ? [ours(b, m.season_page), "The season", "schedule, rosters, standings", false] : null,
      m.held !== "tagpro.eu" && m.url ? [m.url, "The pastebin", "where this record was posted \u2197", true] : null,
    ].filter(Boolean);
    // what tagpro.eu itself records about the match, beyond the scoreboard
    const p = m.played_on;
    const played = p ? [
      ["Server", (p.server || "").replace(/\.koalabeast\.com$/, "") + (p.port ? ":" + p.port : "")],
      ["Kind", p.kind + (p.official === "yes" ? ", official" : "")],
      ["Length", p.duration + (p.time_limit ? " of " + p.time_limit + ":00" : "")],
      ["Finished", p.finished === "yes" ? "played to the whistle" : "ended early"],
      ["Map", (m.map || "") + (m.map_author ? " by " + m.map_author : "")],
    ].filter(([, v]) => String(v || "").trim() && String(v).trim() !== ":") : null;
    // the caps in the order they were scored, with the clock each one went in at
    const names = m.teams.map(t => t.team || t.name);
    const caps = (m.captures || []).length ? m.captures.map(c =>
      `<li class="${c.side === 2 ? "two" : "one"}"><span class="clock">${esc(c.clock)}</span>
        <span class="who">${esc(c.player)}</span>
        <span class="for">${esc(names[(c.side || 1) - 1] || "")}</span></li>`).join("") : "";
    out.innerHTML = `<h1>${esc(m.team_1)} v ${esc(m.team_2)}</h1>
      <p class="meta">${esc(m.season_label || m.season)} ${esc(LEAGUE[m.league] || m.tier || m.league)}${stage ? " \u00b7 " + stage : ""} \u00b7 ${esc(m.game || "")}${m.half ? " " + esc(m.half) : ""}${when ? " \u00b7 " + esc(when) : ""}${m.minutes ? " \u00b7 " + esc(m.minutes) + " minutes" : ""}${m.map ? " \u00b7 " + esc(m.map) : ""}${m.map_author ? " by " + esc(m.map_author) : ""}</p>
      <div class="score">${m.teams.map((t, i) => `<span class="side ${i ? "two" : "one"}"><span>${esc(t.team || t.name)}</span><span class="n">${esc(t.score ?? "?")}</span></span>`).join('<span class="dash">\u2013</span>')}
        ${ended ? `<span class="ended">${ended}</span>` : ""}</div>
      <div class="ways">${ways.map(([href, label, sub, out_]) => `<a href="${esc(href)}"${out_ ? ' target="_blank" rel="noopener"' : ""}><b>${esc(label)}</b> <span>${esc(sub)}</span></a>`).join("")}</div>
      ${m.teams_matched === false ? `<p class="warn">Which side is which team isn\u2019t settled: too few of the players are on either roster, so the two sides are shown as the record has them.</p>` : ""}
      ${m.unnamed ? `<p class="warn">The schedule never wrote one of these teams down, so it is shown by the tag it played under.</p>` : ""}
      ${played ? `<dl class="played">${played.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
      ${m.no_scoreboard
        ? `<p class="warn">The archive has this match's place in the season but not its scoreboard: it was played
            after the local copy of tagpro.eu ends, so the line-ups and the stats are only on tagpro.eu itself.</p>`
        : `<div class="tables" style="margin-top:16px">${m.teams.map(table).join("")}</div>`}
      ${caps ? `<div class="caps"><h2>Captures</h2><ol>${caps}</ol></div>` : ""}
      ${m.held === "tagpro.eu"
        ? `<p class="note">This is the archive\u2019s own copy of the tagpro.eu record \u2014 the scoreboard as tagpro.eu kept it, read out of a full local copy of the site. The match on tagpro.eu itself is at <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a>.</p>`
        : `<p class="note">${m.kind === "tagpro.eu match" ? "The tagpro.eu match record, saved to pastebin" : "A stats sheet saved to pastebin \u2014 one row per player"}: <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a>. tagpro.eu doesn\u2019t have this match.</p>
      <p class="note">A pastebin can be deleted by whoever posted it, so the archive keeps its own copy of every one:
        <a href="pastebin_records.zip" download>download them all</a> (the pages as fetched, and each read as a match).</p>`}`;
  })).catch(() => {
    out.innerHTML = `<h1>Match not held</h1><p class="meta">No saved record for <code>${esc(id)}</code>.</p>`;
  });
})();
</script>
</body>
</html>
